# Draft harmonization rules.
# These are placeholders and MUST be revised after inspecting the actual source values.

leo:
  max_altitude_km: 2000

analytical_object_classes:
  active_satellite:
    description: Operational spacecraft/satellite.
  inactive_object:
    description: Inactive payloads, defunct spacecraft, and rocket bodies where appropriate.
  debris:
    description: Catalogued debris and fragmentation-related objects.
  unknown:
    description: Objects that cannot yet be assigned confidently.

suggested_altitude_bands_km:
  - [0, 200]
  - [200, 400]
  - [400, 600]
  - [600, 800]
  - [800, 1000]
  - [1000, 1200]
  - [1200, 1500]
  - [1500, 2000]
